name: Build SARA APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SARA-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARA-Android-APK
          path: SARA-Android.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sara-v1.0.${{ github.run_number }}
          name: SARA Android v1.0.${{ github.run_number }}
          body: |
            SARA Android APK — ready to install.

            Download SARA-Android.apk below and install it on your Android phone.
          files: SARA-Android.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
