<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SARA — Urdu/Hindi AI Agent</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050509;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif;overflow:hidden}.app{width:100%;height:100dvh;display:flex;flex-direction:column}.top{position:absolute;z-index:5;left:18px;right:18px;top:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.brand{font-weight:800;font-size:20px;text-shadow:0 2px 12px #000}.tag{font-size:12px;color:#ddd;background:#111a;padding:8px 12px;border-radius:999px}.status{position:absolute;z-index:6;top:54px;left:18px;padding:8px 12px;border-radius:10px;background:#111a;color:#b8b8c8;font-size:13px}.ok{color:#47e2a0}.bad{color:#ff7182}.stage{width:100%;height:100dvh;background:#000;overflow:hidden}.stage>*{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important}.stage:empty:before{content:'SARA connect ho rahi hai…';position:absolute;inset:0;display:grid;place-items:center;color:#aaa;font-size:18px}.note{display:none}</style>
</head>
<body>
<div class="app">
<div class="top"><div class="brand">SARA</div><div class="tag">اردو • हिंदी • Real-time</div></div>
<div id="status" class="status">SARA connect ho rahi hai…</div>
<div id="sara-agent" class="stage"></div>
</div>
<script type="module" src="https://agent.d-id.com/v2/index.js" data-mode="full" data-target-id="sara-agent" data-client-key="ck_HKSbJtwQnIv6enW8MuCz1" data-agent-id="v2_agt_UZimmP85" data-name="did-agent" data-monitor="true" data-orientation="vertical" data-open-mode="expanded" data-auto-connect="true"></script>
<script>
const s=document.getElementById('status');let n=0;const t=setInterval(()=>{n++;if(window.DID_AGENTS_API){s.textContent='SARA ready — baat kar sakte hain';s.className='status ok';clearInterval(t)}else if(n>60){s.textContent='D-ID connection issue — client key/domain check required';s.className='status bad';clearInterval(t)}},250);window.addEventListener('error',e=>{if(e&&e.message){s.textContent='D-ID error: '+e.message;s.className='status bad'}});
</script>
</body>
</html>
