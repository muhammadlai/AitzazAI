<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARA — Real D-ID Avatar Test</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080811;color:#f7f7fb;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:30px;font-weight:900}.brand span{color:#f14bb6}.pill{padding:8px 12px;border:1px solid #34344b;border-radius:999px;color:#9b9bb3;font-size:12px}.card{background:#121221;border:1px solid #303047;border-radius:18px;padding:20px}.agent{height:650px;min-height:500px;border:1px dashed #3a3a55;border-radius:16px;background:#07070d;overflow:hidden}.log{height:150px;overflow:auto;background:#07070d;border:1px solid #29293d;border-radius:12px;padding:12px;margin-top:14px;font:12px monospace;color:#bfc0d0;white-space:pre-wrap}.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:12px 16px;background:#27273b;color:white;cursor:pointer;font-weight:700}.primary{background:linear-gradient(135deg,#f14bb6,#8b5cf6)}.ok{color:#35e39a}.bad{color:#ff6b7d}.hint{color:#a6a6bd;font-size:13px;line-height:1.5}@media(max-width:700px){.wrap{padding:12px}.agent{height:600px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="brand">S<span>ARA</span></div><div class="hint">Real D-ID video avatar • voice • lip-sync • realtime conversation</div></div><div class="pill" id="status">LOADING D-ID…</div></div>
  <div class="card">
    <h2 style="margin-top:0">SARA Real Avatar</h2>
    <p class="hint">This page now uses the D-ID Agent Embed directly in full mode. No fake image or mouth overlay.</p>
    <div id="agent-container" class="agent"></div>
    <div class="actions"><button class="primary" id="connect">Connect SARA</button><button id="speak">Make SARA speak</button><button id="mic">Allow microphone</button></div>
    <div class="log" id="log">Starting D-ID…\n</div>
  </div>
</div>

<script>
const logBox=document.getElementById('log');
const statusBox=document.getElementById('status');
function log(x){logBox.textContent+='['+new Date().toLocaleTimeString()+'] '+x+'\n';logBox.scrollTop=logBox.scrollHeight}

window.addEventListener('error',e=>log('Browser error: '+e.message));

/* Exact D-ID Studio embed values supplied for this SARA test. */
</script>
<script type="module"
  src="https://agent.d-id.com/v2/index.js"
  data-mode="full"
  data-target-id="agent-container"
  data-client-key="ck_HKSbJtwQnIv6enW8MuCz1"
  data-agent-id="v2_agt_UZimmP85"
  data-name="did-agent"
  data-monitor="true"
  data-orientation="horizontal"
  data-position="right"
  data-open-mode="expanded"
  data-auto-connect="true">
</script>
<script>
function watch(){
  const api=window.DID_AGENTS_API;
  if(!api){statusBox.textContent='D-ID NOT READY';statusBox.className='pill bad';return false}
  statusBox.textContent='D-ID API READY';statusBox.className='pill ok';
  log('D-ID API detected.');
  try{
    if(api.events&&api.events.on){
      api.events.on('connection',({state})=>{statusBox.textContent='D-ID '+String(state).toUpperCase();log('Connection: '+state);});
      api.events.on('agentActivity',({state})=>log('Agent activity: '+state));
      api.events.on('error',({error})=>{log('D-ID error: '+JSON.stringify(error));statusBox.textContent='D-ID ERROR';statusBox.className='pill bad'});
    }
  }catch(e){log('Event setup error: '+e.message)}
  return true;
}
let tries=0;const timer=setInterval(()=>{tries++;if(watch()||tries>100)clearInterval(timer)},200);

document.getElementById('connect').onclick=async()=>{
  const api=window.DID_AGENTS_API;
  if(!api){log('D-ID API is not loaded. The client key may not allow this GitHub Pages domain.');return}
  try{
    if(api.functions.connect) await api.functions.connect();
    else log('Embed controls loaded; auto-connect is enabled.');
  }catch(e){log('Connect error: '+e.message)}
};

document.getElementById('speak').onclick=async()=>{
  const api=window.DID_AGENTS_API;
  if(!api?.functions?.speak){log('Speak is not ready yet. Connect SARA first.');return}
  try{await api.functions.speak({type:'text',input:'Hello! I am Sara. Welcome to my real avatar test. How are you today?'});log('Speech request sent.')}catch(e){log('Speak error: '+e.message)}
};

document.getElementById('mic').onclick=async()=>{
  try{await navigator.mediaDevices.getUserMedia({audio:true});log('Microphone permission granted.')}catch(e){log('Microphone error: '+e.message)}
};
</script>
</body>
</html>
