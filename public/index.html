<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SARA — Local Real Avatar Test</title><style>body{margin:0;background:#080811;color:#fff;font-family:system-ui;padding:24px}main{max-width:900px;margin:auto}section{background:#12121d;border:1px solid #29293a;border-radius:18px;padding:20px;margin-bottom:16px}button{background:#8b5cf6;color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.avatar{height:620px;border-radius:14px;background:#09090f;border:1px solid #303044;position:relative}.mount{position:absolute;inset:0}.muted{color:#aaaabd;font-size:13px;line-height:1.5}input{padding:11px;border-radius:9px;border:1px solid #333348;background:#0a0a12;color:white;width:100%;box-sizing:border-box}</style></head><body><main><h1>SARA</h1><p class="muted">Local real-time D-ID avatar test. No fake mouth overlay.</p><section><div class="avatar"><div id="didMount" class="mount"></div></div><p><button id="connect">Connect SARA</button> <button id="speak">Test voice</button></p></section><section><h2>Configuration</h2><p class="muted">For the local server, D-ID credentials are read from the server environment. For GitHub Pages, use the root dashboard and enter the client key in Settings.</p><pre id="status" class="muted">Checking…</pre></section></main><script>const $=id=>document.getElementById(id);async function cfg(){try{const r=await fetch('/api/config');const j=await r.json();$('status').textContent=JSON.stringify(j,null,2);return j}catch(e){$('status').textContent='Server unavailable: '+e.message}}async function connect(){const c=await cfg();if(!c?.did?.enabled){alert('Set DID_AGENT_ID and DID_CLIENT_KEY in .env first.');return}if(document.getElementById('did-script'))return;const s=document.createElement('script');s.id='did-script';s.type='module';s.src='https://agent.d-id.com/v2/index.js';s.dataset.mode='full';s.dataset.targetId='didMount';s.dataset.clientKey=c.did.clientKey;s.dataset.agentId=c.did.agentId;s.dataset.name='did-agent';s.dataset.openMode='expanded';s.dataset.autoConnect='true';document.body.appendChild(s)}$('connect').onclick=connect;$('speak').onclick=()=>{const f=window.DID_AGENTS_API?.functions;if(f?.speak)f.speak({type:'text',input:'Assalam-o-alaikum! Main SARA hoon. Welcome!'});else alert('Connect SARA first.')}cfg();</script></body></html>
